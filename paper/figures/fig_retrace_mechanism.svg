<svg xmlns="http://www.w3.org/2000/svg" width="960" height="318"
 viewBox="0 0 960 318">
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4"
          orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L8,4 L0,8 z" fill="#596579"/>
  </marker>
  <style>text { font-family: 'Times New Roman', 'Liberation Serif', serif; }</style>
</defs>
<rect width="100%" height="100%" fill="white"/>
<text x="18" y="25" font-size="15.5" fill="#17202B" font-weight="bold" font-style="normal" text-anchor="start">Balanced Carrier Gate (BCG): admit only orientation-robust response channels</text>
<text x="942" y="25" font-size="11" fill="#596579" font-weight="normal" font-style="italic" text-anchor="end">computed before εᵢ and wᵢ are consulted</text>
<rect x="18" y="39" width="452" height="225" rx="10" fill="white" stroke="#CCD3DD" stroke-width="1.2"/>
<rect x="490" y="39" width="452" height="225" rx="10" fill="white" stroke="#CCD3DD" stroke-width="1.2"/>
<circle cx="40" cy="59" r="12" fill="#005AB5" stroke="#005AB5" stroke-width="1"/>
<text x="40" y="63.5" font-size="12" fill="white" font-weight="bold" font-style="normal" text-anchor="middle">A</text>
<text x="61" y="57" font-size="15" fill="#17202B" font-weight="bold" font-style="normal" text-anchor="start">Two-sided response</text>
<text x="61" y="74" font-size="10.5" fill="#596579" font-weight="normal" font-style="normal" text-anchor="start">usable for either keyed orientation</text>
<circle cx="512" cy="59" r="12" fill="#B2182B" stroke="#B2182B" stroke-width="1"/>
<text x="512" y="63.5" font-size="12" fill="white" font-weight="bold" font-style="normal" text-anchor="middle">B</text>
<text x="533" y="57" font-size="15" fill="#17202B" font-weight="bold" font-style="normal" text-anchor="start">One-sided response</text>
<text x="533" y="74" font-size="10.5" fill="#596579" font-weight="normal" font-style="normal" text-anchor="start">usable only for one orientation</text>
<text x="42" y="82" font-size="11" fill="#596579" font-weight="bold" font-style="normal" text-anchor="start">RRB sign-mass partition of pᵢ(base)</text>
<rect x="42" y="91" width="404" height="34" rx="7" fill="#F6F8FA" stroke="#CCD3DD" stroke-width="1"/>
<path d="M43,92 h188.88 v32 h-188.88 z" fill="#B2182B"/>
<path d="M231.88,92 h213.12 v32 h-213.12 z" fill="#005AB5"/>
<text x="136.94" y="113" font-size="12" fill="white" font-weight="bold" font-style="normal" text-anchor="middle">q₋ = 0.47</text>
<text x="338.94" y="113" font-size="12" fill="white" font-weight="bold" font-style="normal" text-anchor="middle">q₊ = 0.53</text>
<text x="44" y="140" font-size="10.5" fill="#B2182B" font-weight="bold" font-style="normal" text-anchor="start">gᵢ(z) &lt; 0</text>
<text x="444" y="140" font-size="10.5" fill="#005AB5" font-weight="bold" font-style="normal" text-anchor="end">gᵢ(z) &gt; 0</text>
<rect x="42" y="154" width="404" height="34" rx="7" fill="#EAF5EE" stroke="#287A4B" stroke-width="1.1"/>
<text x="56" y="176" font-size="12.5" fill="#287A4B" font-weight="bold" font-style="normal" text-anchor="start">Sᵢ = 2 min(.53, .47) = .94  &gt;  sₘᵢₙ=.50</text>
<rect x="346" y="160" width="89" height="22" rx="11" fill="#287A4B" stroke="#287A4B" stroke-width="1"/>
<text x="390.5" y="175" font-size="10.5" fill="white" font-weight="bold" font-style="normal" text-anchor="middle">BCG admits</text>
<rect x="42" y="199" width="194" height="38" rx="7" fill="#EAF3FC" stroke="#005AB5" stroke-width="1"/>
<text x="54" y="214" font-size="10.5" fill="#005AB5" font-weight="bold" font-style="normal" text-anchor="start">key asks +</text>
<text x="54" y="229" font-size="10.5" fill="#17202B" font-weight="normal" font-style="normal" text-anchor="start">one-draw mass = 0.53</text>
<rect x="252" y="199" width="194" height="38" rx="7" fill="#FBEAEC" stroke="#B2182B" stroke-width="1"/>
<text x="264" y="214" font-size="10.5" fill="#B2182B" font-weight="bold" font-style="normal" text-anchor="start">key asks −</text>
<text x="264" y="229" font-size="10.5" fill="#17202B" font-weight="normal" font-style="normal" text-anchor="start">one-draw mass = 0.47</text>
<text x="514" y="82" font-size="11" fill="#596579" font-weight="bold" font-style="normal" text-anchor="start">RRB sign-mass partition of pᵢ(base)</text>
<rect x="514" y="91" width="404" height="34" rx="7" fill="#F6F8FA" stroke="#CCD3DD" stroke-width="1"/>
<path d="M515,92 h11.12 v32 h-11.12 z" fill="#B2182B"/>
<path d="M526.12,92 h390.88 v32 h-390.88 z" fill="#005AB5"/>
<text x="722.06" y="113" font-size="12" fill="white" font-weight="bold" font-style="normal" text-anchor="middle">q₊ = 0.97</text>
<text x="516" y="140" font-size="10.5" fill="#B2182B" font-weight="bold" font-style="normal" text-anchor="start">gᵢ(z) &lt; 0</text>
<text x="916" y="140" font-size="10.5" fill="#005AB5" font-weight="bold" font-style="normal" text-anchor="end">gᵢ(z) &gt; 0</text>
<rect x="514" y="154" width="404" height="34" rx="7" fill="#F6F8FA" stroke="#697384" stroke-width="1.1"/>
<text x="528" y="176" font-size="12.5" fill="#697384" font-weight="bold" font-style="normal" text-anchor="start">Sᵢ = 2 min(.97, .03) = .06  &lt;  sₘᵢₙ=.50</text>
<rect x="816" y="160" width="91" height="22" rx="11" fill="#697384" stroke="#697384" stroke-width="1"/>
<text x="861.5" y="175" font-size="10.5" fill="white" font-weight="bold" font-style="normal" text-anchor="middle">BCG rejects</text>
<rect x="514" y="199" width="194" height="38" rx="7" fill="#EAF3FC" stroke="#005AB5" stroke-width="1"/>
<text x="526" y="214" font-size="10.5" fill="#005AB5" font-weight="bold" font-style="normal" text-anchor="start">key asks +</text>
<text x="526" y="229" font-size="10.5" fill="#17202B" font-weight="normal" font-style="normal" text-anchor="start">one-draw mass = 0.97</text>
<text x="698" y="223" font-size="11" fill="#005AB5" font-weight="bold" font-style="normal" text-anchor="end">P₈ = 1.00</text>
<rect x="724" y="199" width="194" height="38" rx="7" fill="#FBEAEC" stroke="#B2182B" stroke-width="1"/>
<text x="736" y="214" font-size="10.5" fill="#B2182B" font-weight="bold" font-style="normal" text-anchor="start">key asks −</text>
<text x="736" y="229" font-size="10.5" fill="#17202B" font-weight="normal" font-style="normal" text-anchor="start">one-draw mass = 0.03</text>
<text x="908" y="223" font-size="11" fill="#B2182B" font-weight="bold" font-style="normal" text-anchor="end">P₈ = 0.22</text>
<line x1="244.0" y1="264" x2="244.0" y2="277" stroke="#596579" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="716.0" y1="264" x2="716.0" y2="277" stroke="#596579" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="18" y="280" width="452" height="25" rx="12" fill="#EAF5EE" stroke="#287A4B" stroke-width="1"/>
<text x="244.0" y="297" font-size="11.5" fill="#287A4B" font-weight="bold" font-style="normal" text-anchor="middle">RAR may steer  •  RRV counts one Bernoulli trial</text>
<rect x="490" y="280" width="452" height="25" rx="12" fill="#F6F8FA" stroke="#697384" stroke-width="1"/>
<text x="716.0" y="297" font-size="11.5" fill="#697384" font-weight="bold" font-style="normal" text-anchor="middle">reference sampling  •  no detector trial</text>
<text x="480" y="316" font-size="10.5" fill="#9B6A16" font-weight="bold" font-style="normal" text-anchor="middle">Orientation-free gate: Sᵢ is invariant to swapping the two RRB arms; εᵢ and wᵢ enter only after admission.</text>
</svg>